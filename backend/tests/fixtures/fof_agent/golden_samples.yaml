## 样本 2: 样本不足触发反思

### 输入
funds:
  - fund_id: "insufficient_fund"
    fund_name: "样本不足基金"
    frequency: "monthly"
    nav_points:
      - observation_date: "2024-01-01", net_asset_value: 1.0000
      - observation_date: "2024-02-01", net_asset_value: 1.0100
      - observation_date: "2024-03-01", net_asset_value: 1.0200

risk_profile: "conservative"

### 期望输出
recommendations: []

reflection:
  passed: false
  warnings:
    - "可推荐产品少于 2 个，无法形成有效的 FOF 分散化。"
    - "净值观测少于 8 个，样本不足，不纳入推荐。"

plan_revisions: 1
