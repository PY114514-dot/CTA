# Alembic configuration for the FOF platform backend.
#
# The database URL is intentionally left empty: migrations/env.py derives it
# from app.database.DATABASE_URL (the DATABASE_URL env var or the zero-config
# SQLite default), keeping a single source of truth with the application.
# init_db() additionally passes a live application connection through
# config.attributes["connection"], so no URL is resolved at startup either.
#
# Usage (from backend/):
#   DATABASE_URL=sqlite:///<path> python -m alembic upgrade head
#   DATABASE_URL=sqlite:///<path> python -m alembic revision --autogenerate -m "..."

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
